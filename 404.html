<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — SHMB Digital Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1C1917; --rose: #C08A7D; --text: #F3EEE7; --text-dim: #B3A99E; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px;
  }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 6vw, 48px); margin-bottom: 16px; }
  p { color: var(--text-dim); font-size: 16px; margin-bottom: 28px; }
  a { color: var(--rose); font-family: 'Space Grotesk', sans-serif; font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/">Back to home →</a>
  </div>
</body>
</html>
